name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-kosmos
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (used by the frontend tests) requires Node ^22.22.2,
          # ^24.15.0, or >=26 — Node 20 fails at runtime with a webidl error.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generates the Prisma client types the backend's typecheck/tests
      # import (@prisma/client) — needs the schema, not a live database.
      - run: pnpm prisma:generate

      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/kosmos
            git fetch origin master
            git reset --hard origin/master
            # Named volumes (postgres_data) are untouched by up/--build; only
            # `docker compose down -v` or `docker volume rm` would delete them.
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
