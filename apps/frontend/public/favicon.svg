<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- Stars -->
  <circle cx="10" cy="13" r="1.2" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="52" cy="9" r="0.9" fill="#e2e8f0" opacity="0.4"/>
  <circle cx="55" cy="50" r="1.1" fill="#e2e8f0" opacity="0.45"/>
  <circle cx="9" cy="53" r="0.8" fill="#e2e8f0" opacity="0.4"/>
  <defs>
    <clipPath id="rkb"><rect x="0" y="0" width="64" height="32"/></clipPath>
    <clipPath id="rkf"><rect x="0" y="32" width="64" height="32"/></clipPath>
  </defs>
  <!-- Ring back half (behind planet) -->
  <ellipse cx="32" cy="32" rx="24" ry="8" fill="none" stroke="#7dd3fc" stroke-width="2.5"
           transform="rotate(-22 32 32)" clip-path="url(#rkb)" opacity="0.4"/>
  <!-- Planet -->
  <circle cx="32" cy="32" r="13" fill="#38bdf8"/>
  <circle cx="27" cy="26" r="5" fill="#bae6fd" opacity="0.3"/>
  <!-- Ring front half (in front of planet) -->
  <ellipse cx="32" cy="32" rx="24" ry="8" fill="none" stroke="#7dd3fc" stroke-width="2.5"
           transform="rotate(-22 32 32)" clip-path="url(#rkf)"/>
</svg>
